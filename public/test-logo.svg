<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" style="background:white">
  <defs>
    <linearGradient id="gradTealBright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1EA89B" />
      <stop offset="100%" stop-color="#2DC5B2" />
    </linearGradient>
    <linearGradient id="gradTealDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#115D5A" />
      <stop offset="100%" stop-color="#0C4846" />
    </linearGradient>
    <linearGradient id="gradTealMed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17736E" />
      <stop offset="100%" stop-color="#125D5A" />
    </linearGradient>
  </defs>

  <g transform="translate(150, 20)">
    <!-- Top Ribbon / S upper curve -->
    <!-- Top-left to top apex to top-right -->
    <!-- Dark teal outer top-right facet -->
    <path d="M 100,20 L 152,50 L 152,86 L 126,71 L 126,59 L 100,44 Z" fill="#115D5A" />
    
    <!-- Top-left outer facet -->
    <path d="M 48,50 L 100,20 L 100,44 L 68,62 L 48,50 Z" fill="#0D4E4C" />
    
    <!-- Bright turquoise diagonal ribbon (Upper S-bar) -->
    <!-- Sloping from (48, 50) diagonally down-right to (126, 95) -->
    <path d="M 48,50 L 126,95 L 126,118 L 100,103 L 48,73 Z" fill="url(#gradTealBright)" />
    
    <!-- Shadow facet under the bright ribbon -->
    <path d="M 100,103 L 126,118 L 126,128 L 100,113 Z" fill="#115D5A" />

    <!-- Lower Ribbon / S lower curve -->
    <!-- Bottom left vertical column and bottom V -->
    <path d="M 48,62 L 48,122 L 100,152 L 100,128 L 68,110 L 68,74 Z" fill="#115D5A" />
    
    <!-- Bottom right V facet -->
    <path d="M 100,152 L 152,122 L 126,107 L 100,122 Z" fill="#0D4E4C" />
  </g>

  <!-- Typography -->
  <g transform="translate(250, 260)" text-anchor="middle">
    <text font-family="'Inter', 'Montserrat', 'Helvetica Neue', sans-serif" font-size="48" font-weight="900" letter-spacing="1">
      <tspan fill="#135E5B">CONSEN</tspan><tspan fill="#25BDA7">TRA</tspan>
    </text>
    <!-- Subtitle aligned to the right, under SENTRA -->
    <text x="75" y="28" font-family="'Inter', 'Montserrat', 'Helvetica Neue', sans-serif" font-size="14" font-weight="700" fill="#3B4449" letter-spacing="3">
      SEGURANÇA DO TRABALHO
    </text>
  </g>
</svg>